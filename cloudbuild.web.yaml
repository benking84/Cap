substitutions:
  _PROJECT_ID: "aviato-cap-dev2"
  _REGION: "australia-southeast1"
  _REPO: "cap-repo"
  _TAG: "$BUILD_ID" # default, will be overridden if passed in CLI

steps:
  - name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/cap-web:${_TAG}
      - -f
      - Dockerfile.web
      - .

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/cap-web:${_TAG}



